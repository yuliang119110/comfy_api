[project]
name = "comfy-api"
version = "0.1.0"
description = "ComfyUI multi-modal API Gateway with load balancing and MCP skill exposure"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.25.0",
    "websockets>=11.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.6",
    "mcp>=1.0.0",
]

[project.scripts]
comfy-api = "comfy_api.main:run"

[tool.uv]
package = false
